<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#09090b" />
		<title>404 — nostrfy</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #09090b;
				color: #e4e4e7;
				font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			main {
				text-align: center;
				padding: 2rem 1.5rem;
			}
			.code {
				font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				font-size: 5rem;
				font-weight: 700;
				color: #ec9d75;
				margin: 0;
			}
			h1 {
				font-size: 1.5rem;
				margin: 1.5rem 0 0;
				color: #fafafa;
			}
			p {
				color: #a1a1aa;
				margin: 0.75rem auto 0;
				max-width: 24rem;
				font-size: 0.9375rem;
				line-height: 1.6;
			}
			a {
				display: inline-flex;
				align-items: center;
				gap: 0.5rem;
				margin-top: 2rem;
				background: #cf713d;
				color: #ffffff;
				text-decoration: none;
				font-size: 0.875rem;
				font-weight: 600;
				border-radius: 0.75rem;
				padding: 0.625rem 1.25rem;
				transition: background 0.15s ease;
			}
			a:hover {
				background: #b85d32;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="code">404</p>
			<h1 id="title">Page not found</h1>
			<p id="body">The page you're looking for doesn't exist or has moved.</p>
			<a id="home" href="/">← Back to home</a>
		</main>
		<script>
			(function () {
				try {
					var primary = String(
						(navigator.languages && navigator.languages[0]) || navigator.language || ''
					).toLowerCase();
					if (primary.indexOf('zh') !== 0) return;
					var hant = /hant|tw|hk|mo/.test(primary);
					document.documentElement.lang = hant ? 'zh-Hant' : 'zh-Hans';
					document.getElementById('title').textContent = hant ? '找不到頁面' : '页面未找到';
					document.getElementById('body').textContent = hant
						? '你造訪的頁面不存在或已被移動。'
						: '你访问的页面不存在或已被移动。';
					var home = document.getElementById('home');
					home.textContent = hant ? '← 返回首頁' : '← 返回首页';
					home.setAttribute('href', hant ? '/zh-Hant/' : '/zh-Hans/');
				} catch (e) {}
			})();
		</script>
	</body>
</html>
