<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico?v=2" sizes="any" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32x32.png?v=2" sizes="32x32" type="image/png" />
		<link rel="icon" href="%sveltekit.assets%/favicon-16x16.png?v=2" sizes="16x16" type="image/png" />
		<link
			rel="apple-touch-icon"
			href="%sveltekit.assets%/apple-touch-icon.png?v=2"
		/>
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/inter-var.woff2"
			as="font"
			type="font/woff2"
			crossorigin=""
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/jetbrains-mono-var.woff2"
			as="font"
			type="font/woff2"
			crossorigin=""
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
