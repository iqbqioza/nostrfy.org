<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<script>
			(function () {
				try {
					var path = location.pathname;
					var match = path.match(/^\/(zh-Hans|zh-Hant)(?=\/|$)/);
					var current = match ? match[1] : 'en';
					var stored = localStorage.getItem('nostrfy-lang');
					if (stored) return;
					var primary = String(
						(navigator.languages && navigator.languages[0]) || navigator.language || ''
					).toLowerCase();
					var want = 'en';
					if (primary.indexOf('zh') === 0) {
						want = /hant|tw|hk|mo/.test(primary) ? 'zh-Hant' : 'zh-Hans';
					}
					if (want === current) return;
					var base = path.replace(/^\/(zh-Hans|zh-Hant)(?=\/|$)/, '') || '/';
					var target = want === 'en' ? base : '/' + want + (base === '/' ? '/' : base);
					location.replace(target + location.search + location.hash);
				} catch (e) {}
			})();
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.ico?v=2" sizes="any" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32x32.png?v=2" sizes="32x32" type="image/png" />
		<link rel="icon" href="%sveltekit.assets%/favicon-16x16.png?v=2" sizes="16x16" type="image/png" />
		<link
			rel="apple-touch-icon"
			href="%sveltekit.assets%/apple-touch-icon.png?v=2"
		/>
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/inter-var.woff2"
			as="font"
			type="font/woff2"
			crossorigin=""
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/jetbrains-mono-var.woff2"
			as="font"
			type="font/woff2"
			crossorigin=""
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
